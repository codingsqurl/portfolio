<!DOCTYPE html>
<!-- The server (app/main.py) shows this page whenever someone visits an address that doesn't exist. -->
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <!-- Tells search engines not to list this page. -->
    <meta name="robots" content="noindex">
    <title>Page not found · coding squrl</title>
    <!-- The tab icon. The full path is needed here for the same reason as the styles below. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <!-- This page can show up at any address, even a deep one like /a/b/c, so a link to
         style.css could point to the wrong place. Keeping the styles here avoids that. -->
    <style>
      :root {
        --text: #1d1d1f;
        --text-muted: #6e6e73;
        --bg-light: #f5f5f7;
        --accent: #0071e3;
        --accent-hover: #0077ed;
      }

      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg-light);
        color: var(--text);
        line-height: 1.5;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 0 clamp(16px, 4vw, 32px);
        -webkit-font-smoothing: antialiased;
      }

      h1 {
        font-size: clamp(2.5rem, 7vw, 5rem);
        letter-spacing: -0.02em;
        line-height: 1.1;
        margin: 0 0 0.4em;
      }

      p {
        color: var(--text-muted);
        margin: 0 0 1.5em;
      }

      .button {
        display: inline-block;
        background-color: var(--accent);
        color: white;
        padding: 12px 22px;
        border-radius: 980px;
        text-decoration: none;
        transition: background-color 0.2s, transform 0.2s;
      }

      .button:hover {
        background-color: var(--accent-hover);
        transform: scale(1.03);
      }
    </style>
  </head>

  <body>
    <main>
      <h1>Page not found.</h1>
      <p>That address doesn't lead anywhere. Let's get you back.</p>
      <!-- "/" means the root of the site, so this works no matter how deep the bad address was. -->
      <a class="button" href="/">Back to the homepage</a>
    </main>
  </body>
</html>
