# Publishes the site to GitHub Pages every time you push to main.
# Only the files listed under "Collect the site files" go live, so notes
# like README.md, CHECKLIST.md and the .claude folder stay out of the site.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Adds a "Run workflow" button on the Actions tab for redeploying by hand.
  workflow_dispatch:
  # Redeploys every day at 6am UTC, so new repos and descriptions show up without a push.
  schedule:
    - cron: "0 6 * * *"

# The least access the deploy needs: read the code, write to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# If you push twice quickly, finish one deploy before starting the next.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect the site files
        run: |
          mkdir _site
          cp index.html style.css 404.html favicon.svg og-image.png robots.txt _site/
          # Add new files or folders here when you create them, e.g. images:
          # cp -r images _site/

      # Writes a card for each public GitHub repo into the Work section.
      - name: Add GitHub project cards
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_projects.py _site/index.html

      # Browsers keep a copy of style.css for 10 minutes. Adding a fingerprint of the file
      # (style.css?v=1a2b3c4d) means a changed stylesheet gets a new address, so visitors
      # never see new HTML with old styles. An unchanged file keeps its address and stays cached.
      - name: Fingerprint the stylesheet
        run: |
          HASH=$(sha256sum style.css | cut -c1-8)
          sed -i "s|href=\"style.css\"|href=\"style.css?v=$HASH\"|" _site/index.html
          grep -q "style.css?v=$HASH" _site/index.html

      # GitHub Pages can't send security headers, so the rules go in a <meta> tag instead.
      # If you add Google Fonts, scripts or embeds later, loosen this or they'll be blocked.
      - name: Add the security policy
        run: |
          CSP="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
          perl -0pi -e "s|<!-- SECURITY-POLICY.*?<!-- /SECURITY-POLICY -->|<meta http-equiv=\"Content-Security-Policy\" content=\"$CSP\">|s" _site/index.html
          # Stop the deploy if the policy didn't make it in.
          grep -q 'Content-Security-Policy' _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
